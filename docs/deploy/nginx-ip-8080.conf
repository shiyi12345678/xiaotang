# ==========================================================================
#  直聘通 · Nginx 站点配置（IP 直连版 / 无域名 / 走 8080 端口）
#  部署位置：/etc/nginx/sites-available/zhipintong
#  启用：
#     sudo ln -sf /etc/nginx/sites-available/zhipintong /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠️ 与域名版的区别只有三处：listen 端口、server_name、不配 HTTPS。
#  ⚠️ 需要替换的地方已用 TODO 标注（只有 root 一处必须改）。
# ==========================================================================

server {
    # IP 直连不占用 80/443，规避"未备案不能用 80"的问题
    listen 8080;

    # 用 IP 访问时 Host 就是 IP，这里用通配符避免因 Host 不匹配落到默认站点
    server_name _;

    # TODO: 换成你上传前端产物的实际路径
    root /home/ubuntu/zhipintong/h5-preview;
    index index.html;

    # AI 求职助手支持图片附件，默认 1M 限制会导致 413
    client_max_body_size 20m;

    # ---------- 1. 前端静态资源 ----------
    # uni-app H5 使用 hash 路由（/#/pages/xxx），所有页面都在 index.html 之下，
    # 无需 history 模式回退规则，把根路径交给 index.html 即可。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 2. 后端接口（同源反代，前端用相对路径 /api/v1）----------
    # ⚠️ proxy_pass 末尾【不要】加斜杠：加了会把 /api/v1/xxx 改写成 /v1/xxx，全部 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ AI 求职助手流式输出（SSE / WebSocket）必需，漏配会表现为"AI 一直不回答"
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        # 单轮 AI 生成可能持续较久（后端 AI_TIMEOUT 默认 180s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 3. 用户上传的图片 ----------
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---------- 4. 静态资源缓存（【建议】可选优化）----------
    location ~* \.(js|css|ttf|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# ==========================================================================
#  将来补上域名时怎么升级（前端产物不用重新构建）：
#    1) 把 listen 8080; 改成 listen 80;  并把 server_name _; 改成你的域名
#    2) sudo apt install -y certbot python3-certbot-nginx
#    3) sudo certbot --nginx -d 你的域名          # 自动补全 443 并 301 跳转
#  访问地址即从 http://IP:8080 变为 https://你的域名
# ==========================================================================
