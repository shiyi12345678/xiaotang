# ==========================================================================
#  直聘通 · Nginx 站点配置
#  部署位置：/etc/nginx/sites-available/zhipintong
#  启用：ln -s /etc/nginx/sites-available/zhipintong /etc/nginx/sites-enabled/
#  检查：sudo nginx -t     重载：sudo systemctl reload nginx
#
#  ⚠️ 需要按你的实际情况替换的三处（下文均以 TODO 标注）：
#     1) server_name        —— 你的域名，或服务器公网 IP
#     2) root               —— h5-preview 在服务器上的绝对路径
#     3) listen             —— 无域名（http 直连）时改成 8080
# ==========================================================================

server {
    listen 80;
    # TODO: 换成你的域名；没有域名就写服务器公网 IP
    server_name zhaopin.example.com;

    # TODO: 换成你上传前端产物的实际路径
    root /home/ubuntu/zhipintong/h5-preview;
    index index.html;

    # 上传体积限制（AI 求职助手支持图片附件，默认 1M 会 413）
    client_max_body_size 20m;

    # ---------- 1. 前端静态资源 ----------
    # uni-app H5 用 hash 路由（/#/pages/xxx），所有页面都在 index.html 之下，
    # 因此把根路径整体交给 index.html 即可，不需要 history 模式回退规则。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 2. 后端接口 ----------
    # ⚠️ proxy_pass 末尾【不要】加斜杠：
    #    加斜杠会把 /api/v1/xxx 改写成 /v1/xxx，导致全部 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ AI 求职助手的流式输出（SSE / WebSocket）依赖下面三行：
        #    漏掉会出现「AI 一直不回答」或「回答到一半断开」
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        # 单轮 AI 生成可能持续较久（后端 AI_TIMEOUT 默认 180s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 3. 用户上传的图片 ----------
    # 后端把 server/uploads/ 挂在 /uploads 路径下，漏配会导致头像/附件图 404
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---------- 4. 静态资源缓存（【建议】可选优化）----------
    location ~* \.(js|css|ttf|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 5. 基础安全响应头（【建议】）----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# ==========================================================================
#  HTTPS 说明
#  有域名时，不要手写 443 配置 —— 执行下面这条命令，certbot 会自动补全并
#  把 80 的请求 301 跳到 https：
#      sudo apt install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d zhaopin.example.com
#      sudo certbot renew --dry-run      # 验证自动续期
# ==========================================================================
